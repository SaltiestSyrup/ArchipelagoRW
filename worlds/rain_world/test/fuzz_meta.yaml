Rain World:
  random_starting_region: any_valid

  # Ignore issues with more priority locations than progression items
  passage_priority: 0

  fuzz_constraints:
    # ---Victory Conditions
    - option: which_victory_condition
      if_value: food_quest
      then:
        is_msc_enabled: true
        checks_foodquest: all_slugcats
    - option: which_victory_condition
      if_value: true_ending
      then:
        which_campaign: watcher
    # --- Campaigns
    - option: which_campaign
      if_value: gourmand
      then:
        is_msc_enabled: true
    - option: which_campaign
      if_value: artificer
      then:
        is_msc_enabled: true
    - option: which_campaign
      if_value: rivulet
      then:
        is_msc_enabled: true
    - option: which_campaign
      if_value: spearmaster
      then:
        is_msc_enabled: true
    - option: which_campaign
      if_value: saint
      then:
        is_msc_enabled: true
    - option: which_campaign
      if_value: sofanthiel
      then:
        is_msc_enabled: true
    - option: which_campaign
      if_value: watcher
      then:
        is_watcher_enabled: true