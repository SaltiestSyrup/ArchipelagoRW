name: Fuzz Rain World
on:
  push:
  pull_request:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: Eijebong/ap-actions/fuzz@main
        with:
          apworld-path: worlds/rain_world
          ap-version: latest
          python-version: '3.12'
          runs: 1000
          yamls-per-run: 1
          meta: worlds/rain_world/test/fuzz_meta.yaml
          dump-ignored: false
